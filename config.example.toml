# Global VariantHub config. Run `varhub init` to generate this plus a starter snapshot.
#
# Under annotations_dir, varhub keeps reusable sources plus the snapshot manifests
# that reference them. A source is a data file, a type="builtin" bundle, or a
# type="tool" external annotator — all under sources/:
#
#   <annotations_dir>/
#     sources/<name>/<version>/<name>-<version>.toml   (+ co-located build/tool assets)
#     snapshots/<name>.toml                            (manifest: refs + settings)
#
# A snapshot is the unit `annotate` runs against and the version stamped on results.
# See examples/ for a fully worked tree.
#
# This file lives in VARHUB_HOME (the -home flag, else $VARHUB_HOME, else the current
# directory). Values may reference $VARHUB_HOME, which expands to that base dir (or
# "." when unset). Relative paths also resolve against this file.

data_dir         = "$VARHUB_HOME/data"        # base dir for relative `localpath` source files
cache_dir        = "$VARHUB_HOME/data/cache"  # downloaded sources + tool images/data cached here,
                                             # keyed by name/version (set absolute to share across homes)
# temp_dir       = "/scratch/varhub-tmp"     # base for scratch dirs (tool workdirs, fan-out parts,
                                             # synthesized input); default $TMPDIR or /tmp. `annotate
                                             # --temp-dir DIR` overrides it. Set this if /tmp is small.
default_snapshot = "2026-06"
annotations_dir  = "./annotations"           # root for sources/, snapshots/ (default: $VARHUB_HOME/annotations)
# Config registries for `varhub registry` — each is a static HTTPS registry.toml URL.
# When unset, the built-in default (compgenlab/varianthub-public-data-registry) is used.
# registries = [
#   "https://raw.githubusercontent.com/compgenlab/varianthub-public-data-registry/main/registry.toml",
#   "https://example.org/my-lab-registry/registry.toml",
# ]

# The annotation cache is OPTIONAL: omit the whole [database] block and varhub
# computes annotations without persisting them (no varhub.db is written). Add it to
# memoize results. Cached values are scoped by assembly + data source name:version,
# so different snapshots share a cache safely and GRCh37/GRCh38 never collide.
[database]
backend = "sqlite"                # sqlite (default) | none to disable
path    = "$VARHUB_HOME/varhub.db"

# Reference FASTAs, keyed by assembly. A snapshot's reference is looked up from its
# assembly, so all snapshots on one assembly share a single FASTA (no per-snapshot
# path). Needed by external tools (e.g. VEP) and normalization — not by overlay
# annotation. Add one table per assembly you use.
[references.GRCh38]
fasta = "/data/ref/GRCh38.fa"
# [references.GRCh37]
# fasta = "/data/ref/GRCh37.fa"

# The REST server moved out of this project. `varhub` is CLI-only now; the HTTP
# API, its job queue, and the web UI live in varianthub-web, which runs jobs by
# invoking this binary. A [server] block here is no longer recognized — delete it
# from an existing config.toml.
